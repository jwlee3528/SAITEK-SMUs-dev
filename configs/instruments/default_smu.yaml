# Instrument Connection & Safety Configuration Example
instruments:
  smu_main:
    model: "2450"                      # Options: 2450, 2460, 2461, 2470
    resource_name: "TCPIP0::192.168.1.100::inst0::INSTR"  # or USB0::0x05E6::0x2450::...::INSTR
    command_set: "SCPI"                # Options: SCPI, TSP
    timeout_ms: 10000
    terminals: "FRONT"                 # Options: FRONT, REAR
    sense_mode: "2WIRE"                # Options: 2WIRE, 4WIRE
    safety_limits:
      max_voltage_v: 200.0
      max_current_a: 1.0
      interlock_required: false
