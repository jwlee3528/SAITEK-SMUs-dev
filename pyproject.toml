[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smu-app"
version = "0.1.0"
description = "Tektronix/Keithley SMU (2450/2460/2461/2470) Advanced Control, Analysis, and Data Storage Suite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyvisa>=1.13.0",
    "pyvisa-py>=0.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1.0",
    "h5py>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.0",
    "pyvisa-sim>=0.5.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
